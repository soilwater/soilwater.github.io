<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Lab</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      padding: 0 1.5rem;
    }

    .site-wrapper {
      max-width: 680px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      padding: 4rem 0 2.5rem;
      border-bottom: 1px solid #e5e5e5;
    }

    .lab-name {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .lab-name a {
      color: inherit;
      text-decoration: none;
    }
    .lab-name a:hover { text-decoration: underline; }

    .lab-tagline {
      color: #555;
      font-size: 0.9rem;
    }

    .lab-links {
      margin-top: 0.9rem;
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .lab-links a {
      color: #555;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .lab-links a:hover { text-decoration: underline; }

    /* ── Section label ── */
    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #999;
      margin: 2.5rem 0 0.75rem;
    }

    /* ── Project list ── */
    .project-card {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid #e5e5e5;
      text-decoration: none;
      color: inherit;
    }

    .project-list .project-card:first-child { border-top: 1px solid #e5e5e5; }

    .project-name {
      font-weight: 500;
      color: #0969da;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .project-card:hover .project-name { text-decoration: underline; }

    .project-sep { color: #ccc; flex-shrink: 0; }

    .project-desc {
      color: #555;
      font-size: 0.875rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Footer ── */
    footer {
      padding: 2.5rem 0 3.5rem;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>
<div class="site-wrapper">

  <script>
    const LAB = {
      name:    "Soil Water Processes",
      github:  "https://github.com/soilwater",
      tagline: "Research related to in situ soil physical properties and soil moisture.",
      links: [
        { label: "GitHub", url: "https://github.com/soilwater" },
        { label: "Email",  url: "mailto:andrespatrignani@ksu.edu" },
      ],
    };

    // Add / remove projects here => Fields: name, url, desc
    const PROJECTS = [
      { name: "Kings Creek Soil Moisture Network", url: "https://github.com/soilwater/kings-creek-soil-moisture", desc: "In situ network within the Konza Prairie Biological Station." },
      { name: "PyNotes Agriscience",  url: "https://soilwater.github.io/pynotes-agriscience/",  desc: "Python tutorials for common tasks in agronomy, crop science, and soil science." },
      { name: "PyNotes GEE", url: "https://github.com/yourusername/project-gamma", desc: "Python tutorials for using Google Earth Engine." },
      { name: "CRNPy", url: "https://soilwater.github.io/crnpy/", desc: "A Python toolbox for handling common tasks with cosmic-ray neutron probes."},
      { name: "Soil moisture sensor layouts", url: "https://soilwater.github.io/soil-moisture-sensor-depths/", desc: "App to visualize the error and vertical distribution of different soil moisture sensor layouts."},
      { name: "Quadrat", url: "https://soilwater.github.io/quadrat/", desc: "A digital version of the traditional field quadrat."},
      { name: "Interactive SWRC", url: "https://soilwater.github.io/interactive-swrc/", desc: "Applet to learn the concept of soil water retention curves."},

    ];
  </script>


  <header>
    <h1 class="lab-name"><a id="lab-name-link" href="#"></a></h1>
    <p class="lab-tagline" id="lab-tagline"></p>
    <nav class="lab-links" id="lab-links"></nav>
  </header>

  <p class="section-label">Projects</p>
  <div class="project-list" id="project-list"></div>

  <footer id="footer"></footer>

</div>

<script>
  const nameLink = document.getElementById('lab-name-link');
  nameLink.textContent = LAB.name;
  nameLink.href = LAB.github;
  document.title = LAB.name;

  document.getElementById('lab-tagline').textContent = LAB.tagline;

  const linksEl = document.getElementById('lab-links');
  LAB.links.forEach(({ label, url }) => {
    const a = document.createElement('a');
    a.href = url;
    a.textContent = label;
    linksEl.appendChild(a);
  });

  const listEl = document.getElementById('project-list');
  PROJECTS.forEach(({ name, url, desc }) => {
    const a = document.createElement('a');
    a.className = 'project-card';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.innerHTML = `
      <span class="project-name">${name}</span>
      <span class="project-sep">—</span>
      <span class="project-desc">${desc}</span>
    `;
    listEl.appendChild(a);
  });

  document.getElementById('footer').textContent =
    `© ${new Date().getFullYear()} ${LAB.name}`;
</script>
</body>
</html>
